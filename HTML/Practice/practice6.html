<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=], initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table border="2">
        <caption>A Test Table With Merged Cells</caption>
        <thead>
            <tr>
                <th rowspan="2">Sex</th>
                <th colspan="2">Average Height</th>
                <th rowspan="2">Red eyes</th>
            </tr>
            <tr>
                <th>Height</th>
                <th>Weight</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>Male</th>
                <th>1.9</th>
                <th>0.003</th>
                <th>40%</th>
            </tr>
            <tr>
                <th>Female</th>
                <th>1.7</th>
                <th>0.002</th>
                <th>43%</th>
            </tr>
        </tbody>
    </table>
</body>
</html>
