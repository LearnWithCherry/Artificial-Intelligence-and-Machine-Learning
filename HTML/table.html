<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABLES</title>
</head>
<body>
    <h1>Tables in HTML</h1>
    <table border="5" cellspacing="0" cellpadding="10">
        <caption>My Table</caption>
        <thead>
            <tr>
                <th>Item</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            
            <tr>
                <td>MAC book</td>
                <td>1.5 Lakhs</td>
            </tr>
            <tr>
                <td>Iphone 17</td>
                <td>2 Lakhs</td>
            </tr>
            <tr>
                <td>M5 CS</td>
                <td>2 crore</td>
            </tr>
    </tbody>
</body>
</html>
