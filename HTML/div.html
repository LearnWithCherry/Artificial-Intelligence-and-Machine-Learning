<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- DIV -->
    <h3>Using DIV</h3>
    <div>
        <a href="www.google.com">   Google   </a>
        <a href="www.Youtube.com">  Youtube  </a>
    </div>
    <a href="www.facebook.com"> Facebook </a>
    
    <!-- SPAN -->
    <h3>Using SPAN</h3>
    <span>
        <a href="www.google.com">   Google   </a>
        <a href="www.Youtube.com">  Youtube  </a>
    </span>
        <a href="www.facebook.com"> Facebook </a>
    </body>
</html>
